<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173d30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sumy Livres">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Sumy Livres — Mon journal de lecture</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Caveat:wght@500;600&display=swap');
:root{--forest:#173d30;--forest2:#245542;--cream:#f7f0e5;--paper:#fffaf1;--ink:#202820;--muted:#77756a;--orange:#e95b16;--orange2:#f7d5bd;--line:#e8dccb;--sage:#dce4d4;--shadow:0 12px 30px rgba(45,38,27,.09);--serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;--hand:'Caveat',cursive}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);padding-bottom:calc(92px + env(safe-area-inset-bottom))}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #e99a38;outline-offset:2px}
.app{max-width:760px;margin:0 auto;padding:18px 18px 30px}.topline{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}.brand{display:flex;align-items:center;gap:10px;color:var(--forest);font-family:var(--serif);font-weight:700;font-size:1.25rem}.brand-mark{width:38px;height:38px;border-radius:13px;background:var(--forest);display:grid;place-items:center;color:#fff8ed}.brand-mark svg{width:25px;height:25px}.top-actions{display:flex;gap:8px}.icon-btn{border:1px solid var(--line);background:var(--paper);color:var(--forest);border-radius:13px;width:42px;height:42px;display:grid;place-items:center;font-size:1.15rem}
.view{min-height:65vh}.hero{position:relative;overflow:hidden;min-height:280px;border-radius:28px 28px 16px 16px;background:var(--forest);color:#fff8ed;padding:24px 22px;display:flex;align-items:center;box-shadow:var(--shadow)}.hero-copy{position:relative;z-index:2;width:57%}.hand{font-family:var(--hand);font-size:1.55rem;line-height:1.1;margin:0 0 18px;transform:rotate(-4deg);color:#f8c59e}.hero-date{font-family:var(--serif);font-size:.95rem;color:#e6ddcd;margin:0 0 5px}.clock{font-family:var(--serif);font-size:clamp(3.5rem,13vw,5.5rem);letter-spacing:-.07em;line-height:1;margin:0;color:#fff8ed}.hero-line{font-family:var(--serif);font-style:italic;color:#e6ddcd;margin:12px 0 0;font-size:1rem}.hero-art{position:absolute;right:-3px;bottom:0;width:48%;height:96%;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:10px 14px 18px 0}.leaf{font-size:3.5rem;margin:0 40px -2px 0;color:#c6d1b8;transform:rotate(-18deg)}.book-stack{height:43px;width:min(100%,190px);border:2px solid #47372a;box-shadow:0 5px 8px #10291f88;display:grid;place-items:center;font-family:var(--serif);font-weight:700;transform:skewY(-3deg);font-size:1rem}.book-stack:nth-child(2){background:#e95b16;color:#202820}.book-stack:nth-child(3){background:#f3e3cf;color:#26372e;width:93%}.book-stack:nth-child(4){background:#26332b;color:#f6e7d4;width:85%}.mug{width:70px;height:56px;margin:8px 48px 0 0;border-radius:8px 8px 19px 19px;background:var(--orange);border:4px solid #c74a13;color:#202820;text-align:center;font-size:1.8rem;line-height:47px;box-shadow:0 5px 8px #10291f88}
.greeting{margin:20px 4px 14px}.greeting h1{font:600 1.75rem var(--serif);margin:0 0 4px}.greeting p{color:var(--muted);margin:0}.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 12px}.section-head h2{font:600 1.35rem var(--serif);margin:0}.text-btn{border:0;background:transparent;color:var(--orange);font-weight:700;padding:8px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.action-card{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:16px;text-align:left;min-height:112px;box-shadow:var(--shadow);color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;gap:10px}.action-icon{width:42px;height:42px;border-radius:14px;background:#f7e3d2;display:grid;place-items:center;font-size:1.45rem}.action-card:nth-child(2) .action-icon{background:var(--sage)}.action-card:nth-child(3) .action-icon{background:#f4d5c2}.action-card:nth-child(4) .action-icon{background:#e9e2d1}.action-card strong{font-family:var(--serif);font-size:1.05rem}.action-card small{color:var(--muted)}
.feature-card{margin-top:14px;padding:16px;border-radius:20px;background:#f0dfc9;display:flex;align-items:center;gap:13px}.feature-card .round{width:46px;height:46px;border-radius:50%;background:#fff6e9;display:grid;place-items:center;font-size:1.4rem;flex:none}.feature-card div:nth-child(2){min-width:0;flex:1}.eyebrow{display:block;color:var(--muted);font-size:.75rem;margin-bottom:3px}.feature-card strong{font-family:var(--serif);font-size:1.1rem;display:block;overflow-wrap:anywhere}.feature-card p{font-size:.82rem;color:var(--muted);margin:3px 0 0}.progress{height:7px;border-radius:20px;background:#e9dccb;overflow:hidden;margin-top:9px}.progress i{height:100%;display:block;background:var(--orange);border-radius:20px}
.page-title{font:600 2rem var(--serif);margin:10px 2px 4px}.page-sub{color:var(--muted);margin:0 2px 18px}.toolbar{display:flex;gap:9px;align-items:center;margin:14px 0;flex-wrap:wrap}.search{flex:1;min-width:180px;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:13px 14px;color:var(--ink)}.filter-row{display:flex;gap:7px;overflow:auto;padding:2px 0 8px;scrollbar-width:none}.filter{border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:99px;padding:9px 14px;white-space:nowrap;font-size:.85rem}.filter.active{background:var(--forest);border-color:var(--forest);color:#fff8ed}
.book-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px 11px}.book-card{border:0;background:transparent;text-align:left;padding:0;color:var(--ink);min-width:0}.cover{aspect-ratio:2/3;border-radius:9px 12px 12px 9px;box-shadow:4px 6px 10px #44362625;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;color:white;font:600 1rem var(--serif);position:relative;overflow:hidden}.cover:after{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:#ffffff45}.cover img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.book-name{font:600 .94rem var(--serif);display:block;margin:8px 0 2px;line-height:1.25;overflow-wrap:anywhere}.book-author{font-size:.78rem;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.book-status{font-size:.7rem;color:var(--orange);display:block;margin-top:5px}.empty{padding:30px 18px;border:1px dashed #cdbda8;border-radius:20px;text-align:center;color:var(--muted);background:#fffaf18c}.empty .big{font-size:2.3rem;margin-bottom:8px}
.primary{border:0;background:var(--orange);color:#fffaf1;border-radius:14px;padding:13px 17px;font-weight:700;box-shadow:0 5px 12px #e95b162b}.secondary{border:1px solid var(--line);background:var(--paper);color:var(--forest);border-radius:14px;padding:12px 15px;font-weight:600}.shelf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.shelf-card{background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;text-align:left;color:var(--ink);padding:0}.shelf-art{height:115px;background:var(--forest);color:#f8e8d4;display:flex;align-items:center;justify-content:center;font-size:3.2rem;position:relative}.shelf-card:nth-child(2n) .shelf-art{background:#d7a17f}.shelf-card:nth-child(3n) .shelf-art{background:#8b987a}.shelf-card strong{display:block;padding:12px 12px 3px;font:600 1.05rem var(--serif)}.shelf-card small{display:block;padding:0 12px 13px;color:var(--muted)}
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px}.stat b{display:block;font:600 2rem var(--serif);color:var(--forest)}.stat span{color:var(--muted);font-size:.82rem}.goal-box{background:var(--forest);color:#fff8ed;border-radius:24px;padding:20px;margin:16px 0}.goal-box h2{font:600 1.35rem var(--serif);margin:0 0 5px}.goal-box p{color:#d9dfd1;margin:0}.goal-number{font:600 2.5rem var(--serif);margin:15px 0 0}.goal-box .progress{background:#ffffff35;height:10px}.goal-box .progress i{background:#f18b4d}
.bottom-nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,760px);padding:9px 8px calc(9px + env(safe-area-inset-bottom));background:#fffaf1f2;backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}.nav-btn{border:0;background:transparent;color:#77756a;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.68rem;padding:4px 0}.nav-btn .ico{font-size:1.35rem;line-height:1.2}.nav-btn.active{color:var(--orange);font-weight:700}
.modal-backdrop{position:fixed;z-index:40;inset:0;background:#111a16a8;display:none;align-items:flex-end;justify-content:center;padding:14px}.modal-backdrop.open{display:flex}.modal{width:min(100%,600px);max-height:92vh;overflow:auto;background:var(--paper);border-radius:26px 26px 18px 18px;padding:20px;box-shadow:0 20px 70px #0004}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modal-head h2{font:600 1.45rem var(--serif);margin:0}.close{border:0;background:#f0e7d9;border-radius:50%;width:36px;height:36px;font-size:1.2rem}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:11px}.field.full{grid-column:1/-1}.field label{font-size:.82rem;color:var(--muted);font-weight:600}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fffdf8;border-radius:12px;padding:12px;color:var(--ink)}.field textarea{min-height:90px;resize:vertical}.modal-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px}.modal-actions button{flex:1}.danger{border:1px solid #e8b8aa;color:#a53d28;background:#fff5f1;border-radius:13px;padding:12px;font-weight:600}
.toast{position:fixed;z-index:60;left:50%;bottom:100px;transform:translate(-50%,20px);background:var(--forest);color:white;padding:12px 17px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--shadow);white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
.footer-note{text-align:center;color:var(--muted);font-size:.75rem;padding:25px 0 4px}
@media(min-width:650px){.app{padding:24px 28px 40px}.hero{min-height:315px}.book-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:20px 15px}.bottom-nav{border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0}.modal-backdrop{align-items:center}}
@media(max-width:390px){.app{padding:12px 13px 24px}.hero{min-height:240px;padding:19px 17px}.hero-art{width:45%}.book-stack{height:36px;font-size:.85rem}.leaf{font-size:2.8rem}.mug{width:60px;height:49px;line-height:40px;margin-right:35px}.cards{gap:9px}.action-card{padding:13px;min-height:105px}.book-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:13px 9px}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <header class="topline">
    <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5c3.5-1.4 6.5-.8 9 1.5v13c-2.5-2.3-5.5-2.9-9-1.5z"/><path d="M21 5.5c-3.5-1.4-6.5-.8-9 1.5v13c2.5-2.3 5.5-2.9 9-1.5z"/></svg></span>Sumy Livres</div>
    <div class="top-actions">
      <button class="icon-btn" id="exportBtn" title="Exporter ma bibliothèque" aria-label="Exporter">⇧</button>
      <button class="icon-btn" id="settingsBtn" title="Paramètres" aria-label="Paramètres">⚙</button>
    </div>
  </header>
  <main id="view" class="view" aria-live="polite"></main>
  <div class="footer-note">Un chapitre après l’autre · Sumy Livres ♡</div>
</div>
<nav class="bottom-nav" aria-label="Navigation principale">
  <button class="nav-btn active" data-view="home"><span class="ico">⌂</span>Accueil</button>
  <button class="nav-btn" data-view="library"><span class="ico">▤</span>Bibliothèque</button>
  <button class="nav-btn" data-action="add"><span class="ico">＋</span>Ajouter</button>
  <button class="nav-btn" data-view="challenges"><span class="ico">♜</span>Défis</button>
  <button class="nav-btn" data-view="shelves"><span class="ico">▥</span>Étagères</button>
</nav>
<div class="modal-backdrop" id="modalBackdrop">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head"><h2 id="modalTitle">Ajouter un livre</h2><button class="close" id="closeModal" aria-label="Fermer">×</button></div>
    <form id="bookForm">
      <input type="hidden" id="bookId">
      <div class="form-grid">
        <div class="field full"><label for="title">Titre du livre *</label><input id="title" required maxlength="120" placeholder="Le titre de ton livre"></div>
        <div class="field"><label for="author">Auteur</label><input id="author" maxlength="100" placeholder="Nom de l’auteur"></div>
        <div class="field"><label for="status">Statut</label><select id="status"><option value="alire">À lire</option><option value="encours">En cours</option><option value="termine">Lu / terminé</option></select></div>
        <div class="field"><label for="pages">Nombre de pages</label><input id="pages" type="number" min="0" max="50000" placeholder="320"></div>
        <div class="field"><label for="pagesRead">Pages lues</label><input id="pagesRead" type="number" min="0" max="50000" placeholder="0"></div>
        <div class="field"><label for="rating">Ma note</label><select id="rating"><option value="0">Pas encore noté</option><option value="1">★☆☆☆☆</option><option value="2">★★☆☆☆</option><option value="3">★★★☆☆</option><option value="4">★★★★☆</option><option value="5">★★★★★</option></select></div>
        <div class="field"><label for="color">Couleur de couverture</label><select id="color"><option value="#315b49">Vert forêt</option><option value="#d66a36">Orange</option><option value="#b77b82">Rose ancien</option><option value="#6e7895">Bleu doux</option><option value="#8a7658">Caramel</option><option value="#4c4140">Brun profond</option><option value="#829174">Sauge</option></select></div>
        <div class="field full"><label for="cover">URL d’une image de couverture (facultatif)</label><input id="cover" type="url" placeholder="https://…"></div>
        <div class="field"><label for="finished">Date de lecture terminée</label><input id="finished" type="date"></div>
        <div class="field"><label for="shelf">Étagère</label><select id="shelf"><option>À découvrir</option><option>Coups de cœur</option><option>Fantasy</option><option>Romance</option><option>Policier</option><option>Développement personnel</option><option>Classiques</option><option>Autres</option></select></div>
        <div class="field full"><label for="notes">Mes notes / avis</label><textarea id="notes" placeholder="Ce que j’ai pensé de cette lecture…"></textarea></div>
      </div>
      <div class="modal-actions"><button class="primary" type="submit">Enregistrer le livre</button><button class="danger" type="button" id="deleteBook" hidden>Supprimer</button></div>
    </form>
  </section>
</div>
<div class="modal-backdrop" id="settingsBackdrop">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-head"><h2 id="settingsTitle">Mes paramètres</h2><button class="close" id="closeSettings" aria-label="Fermer">×</button></div>
    <div class="field"><label for="goalInput">Mon objectif annuel (nombre de livres)</label><input id="goalInput" type="number" min="1" max="365"></div>
    <div class="field"><label for="displayName">Mon prénom (sur l’accueil)</label><input id="displayName" maxlength="30" placeholder="Sumy"></div>
    <div class="modal-actions"><button class="primary" id="saveSettings">Enregistrer</button><button class="secondary" id="importBtn">Importer une sauvegarde JSON</button></div>
    <p style="font-size:.8rem;color:var(--muted);line-height:1.5">Tes livres sont enregistrés dans le navigateur de cet appareil. Pense à exporter régulièrement une sauvegarde pour les retrouver si tu changes de téléphone ou de navigateur.</p>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
"use strict";
const KEY="sumy-livres-v2";
const defaults={books:[],goal:24,name:"Sumy"};
let state=load();let currentView="home";let filter="all";let searchText="";let shelfFilter="";
const $=id=>document.getElementById(id);
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||"null");return x&&Array.isArray(x.books)?{...defaults,...x}:structuredClone(defaults)}catch(e){return structuredClone(defaults)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function today(){return new Date().toISOString().slice(0,10)}
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2300)}
function setView(v){currentView=v;document.querySelectorAll(".nav-btn[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===v));render();window.scrollTo({top:0,behavior:"smooth"});}
function statusLabel(s){return ({alire:"À lire",encours:"En cours",termine:"Lu"})[s]||"À lire"}
function finishedYear(b){return (b.finished||b.updated||b.created||today()).slice(0,4)}
function booksDoneThisYear(){return state.books.filter(b=>b.status==="termine"&&finishedYear(b)===String(new Date().getFullYear()))}
function coverHTML(b){if(b.cover)return `<div class="cover"><img src="${esc(b.cover)}" alt="Couverture de ${esc(b.title)}" loading="lazy" onerror="this.remove()"></div>`;return `<div class="cover" style="background:${esc(b.color||"#315b49")}"><span>${esc(b.title)}</span></div>`}
function bookTile(b){return `<button class="book-card" data-edit="${esc(b.id)}">${coverHTML(b)}<span class="book-name">${esc(b.title)}</span><span class="book-author">${esc(b.author||"Auteur inconnu")}</span><span class="book-status">${statusLabel(b.status)}${b.rating?` · ${"★".repeat(b.rating)}`:""}</span></button>`}
function hero(){const d=new Date();const days=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];const months=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];return `<section class="hero"><div class="hero-copy"><p class="hand">Bonne lecture ! ♡</p><p class="hero-date">${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}</p><h1 class="clock" id="clock">${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}</h1><p class="hero-line">Une histoire après l’autre.</p></div><div class="hero-art" aria-hidden="true"><div class="leaf">❧</div><div class="book-stack">Dream Big</div><div class="book-stack">Read More</div><div class="book-stack">Be Happy ♡</div><div class="mug">♡</div></div></section>`}
function renderHome(){const current=state.books.find(b=>b.status==="encours");const done=booksDoneThisYear().length;const goal=Number(state.goal)||24;const pct=Math.min(100,Math.round(done/goal*100));return `${hero()}<section class="greeting"><h1>Bonjour ${esc(state.name||"lectrice")} ♡</h1><p>Prête pour un nouveau chapitre ?</p></section><div class="cards"><button class="action-card" data-go="library"><span class="action-icon">📖</span><strong>Ma bibliothèque</strong><small>${state.books.length} livre${state.books.length>1?"s":""}</small></button><button class="action-card" data-go="shelves"><span class="action-icon">📚</span><strong>Mes étagères</strong><small>Mes livres par envie</small></button><button class="action-card" data-go="challenges"><span class="action-icon">🏆</span><strong>Mes défis</strong><small>${done} / ${goal} livres cette année</small></button><button class="action-card" data-go="stats"><span class="action-icon">✦</span><strong>Mes statistiques</strong><small>Mon année en lecture</small></button></div><div class="feature-card"><div class="round">☕</div><div><span class="eyebrow">Ma lecture en cours</span><strong>${current?esc(current.title):"Le prochain chapitre t’attend"}</strong><p>${current?esc(current.author||"Une belle histoire à poursuivre"):"Ajoute un livre et commence ton aventure."}</p>${current&&current.pages?`<div class="progress"><i style="width:${Math.min(100,Math.round((current.pagesRead||0)/current.pages*100))}%"></i></div>`:""}</div></div><div class="feature-card"><div class="round">🌿</div><div style="flex:1"><span class="eyebrow">Mon objectif ${new Date().getFullYear()}</span><strong>${done} / ${goal} livres lus</strong><div class="progress"><i style="width:${pct}%"></i></div></div></div><div class="section-head"><h2>Mes dernières lectures</h2><button class="text-btn" data-go="library">Tout voir →</button></div>${state.books.length?`<div class="book-grid">${state.books.slice().sort((a,b)=>(b.updated||"").localeCompare(a.updated||"")).slice(0,3).map(bookTile).join("")}</div>`:`<div class="empty"><div class="big">📚</div>Ta bibliothèque commence ici.<br><button class="primary" style="margin-top:14px" data-action="add">＋ Ajouter mon premier livre</button></div>`}`}
function renderLibrary(){const shown=state.books.filter(b=>(filter==="all"||b.status===filter)&&(!searchText||(b.title+" "+(b.author||"")).toLowerCase().includes(searchText)));return `<h1 class="page-title">Ma bibliothèque</h1><p class="page-sub">${state.books.length} livre${state.books.length>1?"s":""} dans mon petit univers</p><div class="toolbar"><input class="search" id="searchBooks" type="search" placeholder="⌕ Chercher un titre ou un auteur…" value="${esc(searchText)}"><button class="primary" data-action="add">＋ Ajouter</button></div><div class="filter-row">${[["all","Tous"],["alire","À lire"],["encours","En cours"],["termine","Lus"]].map(([v,l])=>`<button class="filter ${filter===v?"active":""}" data-filter="${v}">${l}</button>`).join("")}</div>${shown.length?`<div class="book-grid">${shown.map(bookTile).join("")}</div>`:`<div class="empty"><div class="big">🍊</div>${state.books.length?"Aucun livre ne correspond à ta recherche.":"Ta bibliothèque est encore vide."}<br><button class="primary" style="margin-top:14px" data-action="add">＋ Ajouter un livre</button></div>`}`}
const shelves=[["À découvrir","✨","alire"],["En cours","☕","encours"],["Coups de cœur","♡","fav"],["Fantasy","🌙","Fantasy"],["Romance","🌷","Romance"],["Policier","🔎","Policier"],["Développement personnel","🌱","Développement personnel"],["Classiques","📜","Classiques"],["Autres","📚","Autres"]];
function renderShelves(){if(shelfFilter){let list=state.books.filter(b=>shelfFilter==="fav"?b.favorite:b.shelf===shelfFilter);return `<button class="text-btn" data-action="back-shelves">← Toutes les étagères</button><h1 class="page-title">${esc(shelfFilter==="fav"?"Coups de cœur":shelfFilter)}</h1><p class="page-sub">${list.length} livre${list.length>1?"s":""}</p>${list.length?`<div class="book-grid">${list.map(bookTile).join("")}</div>`:`<div class="empty">Cette étagère attend ses premières histoires. ♡</div>`}`}
return `<h1 class="page-title">Mes étagères</h1><p class="page-sub">Chaque livre trouve sa petite place.</p><div class="shelf-grid">${shelves.map(([name,icon,key],i)=>{let n=key==="fav"?state.books.filter(b=>b.favorite).length:key==="alire"||key==="encours"?state.books.filter(b=>b.status===key).length:state.books.filter(b=>b.shelf===key).length;return `<button class="shelf-card" data-shelf="${esc(key)}"><div class="shelf-art">${icon}</div><strong>${name}</strong><small>${n} livre${n>1?"s":""}</small></button>`}).join("")}</div>`}
function renderChallenges(){const done=booksDoneThisYear().length;const goal=Number(state.goal)||24;const pct=Math.min(100,Math.round(done/goal*100));const month=new Date().getMonth();const thisMonth=state.books.filter(b=>b.status==="termine"&&(b.finished||"").slice(0,7)===today().slice(0,7)).length;return `<h1 class="page-title">Mes défis</h1><p class="page-sub">De petits objectifs, de grandes histoires.</p><section class="goal-box"><h2>Mon défi lecture ${new Date().getFullYear()}</h2><p>Lire ${goal} livres cette année</p><div class="goal-number">${done} / ${goal}</div><div class="progress"><i style="width:${pct}%"></i></div><p style="margin-top:9px">${pct>=100?"Objectif atteint ! Bravo ♡":`Encore ${Math.max(0,goal-done)} livre${goal-done>1?"s":""} pour atteindre ton objectif.`}</p></section><div class="section-head"><h2>Mes petits défis</h2></div><div class="feature-card"><div class="round">🌼</div><div><span class="eyebrow">Ce mois-ci</span><strong>${thisMonth} livre${thisMonth>1?"s":""} terminé${thisMonth>1?"s":""}</strong><p>Chaque page compte.</p></div></div><div class="feature-card"><div class="round">⭐</div><div><span class="eyebrow">Mes coups de cœur</span><strong>${state.books.filter(b=>b.favorite).length} livres favoris</strong><p>Les histoires à garder près du cœur.</p></div></div><button class="secondary" style="margin-top:16px" data-action="goal">Modifier mon objectif</button>`}
function renderStats(){const done=state.books.filter(b=>b.status==="termine");const pages=done.reduce((n,b)=>n+(Number(b.pages)||0),0);const rated=done.filter(b=>Number(b.rating)>0);const avg=rated.length?(rated.reduce((n,b)=>n+Number(b.rating),0)/rated.length).toFixed(1).replace(".",","):"—";const inprogress=state.books.filter(b=>b.status==="encours").length;return `<h1 class="page-title">Mes statistiques</h1><p class="page-sub">Un joli aperçu de ton année de lecture.</p><div class="stat-grid"><div class="stat"><b>${state.books.length}</b><span>Livres dans ma bibliothèque</span></div><div class="stat"><b>${done.length}</b><span>Livres terminés</span></div><div class="stat"><b>${pages.toLocaleString("fr-FR")}</b><span>Pages lues (livres terminés)</span></div><div class="stat"><b>${avg}</b><span>Note moyenne sur 5</span></div><div class="stat"><b>${inprogress}</b><span>Lectures en cours</span></div><div class="stat"><b>${state.books.filter(b=>b.favorite).length}</b><span>Coups de cœur</span></div></div><p class="page-sub" style="margin-top:18px">Tes statistiques se mettent à jour à chaque livre ajouté ou modifié.</p>`}
function render(){const v=$("view");if(currentView==="home")v.innerHTML=renderHome();else if(currentView==="library")v.innerHTML=renderLibrary();else if(currentView==="shelves")v.innerHTML=renderShelves();else if(currentView==="challenges")v.innerHTML=renderChallenges();else v.innerHTML=renderStats();}
function openBook(id){const b=state.books.find(x=>x.id===id);$("bookForm").reset();$("bookId").value=b?.id||"";$("modalTitle").textContent=b?"Modifier mon livre":"Ajouter un livre";$("title").value=b?.title||"";$("author").value=b?.author||"";$("status").value=b?.status||"alire";$("pages").value=b?.pages||"";$("pagesRead").value=b?.pagesRead||"";$("rating").value=b?.rating||"0";$("color").value=b?.color||"#315b49";$("cover").value=b?.cover||"";$("finished").value=b?.finished||"";$("shelf").value=b?.shelf||"À découvrir";$("notes").value=b?.notes||"";$("deleteBook").hidden=!b;$("modalBackdrop").classList.add("open");$("title").focus();}
function closeBook(){$("modalBackdrop").classList.remove("open")}
$("bookForm").addEventListener("submit",e=>{e.preventDefault();const id=$("bookId").value||crypto.randomUUID();const old=state.books.find(b=>b.id===id);const status=$("status").value;const obj={id,title:$("title").value.trim(),author:$("author").value.trim(),status,pages:Number($("pages").value)||0,pagesRead:Number($("pagesRead").value)||0,rating:Number($("rating").value)||0,color:$("color").value,cover:$("cover").value.trim(),finished:$("finished").value||(status==="termine"?(old?.finished||today()):""),shelf:$("shelf").value,notes:$("notes").value,favorite:old?.favorite||false,created:old?.created||today(),updated:new Date().toISOString()};if(obj.pages&&obj.pagesRead>obj.pages)obj.pagesRead=obj.pages;if(status==="termine"&&!obj.finished)obj.finished=today();if(status!=="termine"&&!$("finished").value)obj.finished="";if(old)state.books=state.books.map(b=>b.id===id?obj:b);else state.books.unshift(obj);save();closeBook();render();toast(old?"Livre mis à jour ♡":"Livre ajouté à ta bibliothèque ♡");});
$("deleteBook").addEventListener("click",()=>{const id=$("bookId").value;if(!id)return;if(confirm("Supprimer ce livre de ta bibliothèque ?")){state.books=state.books.filter(b=>b.id!==id);save();closeBook();render();toast("Livre supprimé");}});
$("closeModal").onclick=closeBook;$("modalBackdrop").addEventListener("click",e=>{if(e.target===$("modalBackdrop"))closeBook()});
$("closeSettings").onclick=()=>$("settingsBackdrop").classList.remove("open");$("settingsBackdrop").addEventListener("click",e=>{if(e.target===$("settingsBackdrop"))$("settingsBackdrop").classList.remove("open")});
$("settingsBtn").onclick=()=>{$("goalInput").value=state.goal;$("displayName").value=state.name;$("settingsBackdrop").classList.add("open")};
$("saveSettings").onclick=()=>{state.goal=Math.max(1,Math.min(365,Number($("goalInput").value)||24));state.name=$("displayName").value.trim()||"Sumy";save();$("settingsBackdrop").classList.remove("open");render();toast("Paramètres enregistrés");};
$("importBtn").onclick=()=>$("importFile").click();
$("importFile").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!data||!Array.isArray(data.books))throw Error("format");if(confirm("Importer cette sauvegarde ? Les données actuelles seront remplacées.")){state={...defaults,...data};save();render();$("settingsBackdrop").classList.remove("open");toast("Sauvegarde importée ♡");}}catch(err){alert("Impossible de lire ce fichier JSON.");}e.target.value="";});
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="sumy-livres-sauvegarde-"+today()+".json";a.click();URL.revokeObjectURL(url);toast("Sauvegarde téléchargée");}
$("exportBtn").onclick=exportData;
document.querySelector(".bottom-nav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.view)setView(b.dataset.view);if(b.dataset.action==="add")openBook("");});
$("view").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.go)setView(b.dataset.go);if(b.dataset.action==="add")openBook("");if(b.dataset.action==="back-shelves"){shelfFilter="";render();}if(b.dataset.action==="goal"){$("goalInput").value=state.goal;$("displayName").value=state.name;$("settingsBackdrop").classList.add("open");}if(b.dataset.filter){filter=b.dataset.filter;render();}if(b.dataset.edit)openBook(b.dataset.edit);if(b.dataset.shelf){shelfFilter=b.dataset.shelf;render();}});
$("view").addEventListener("input",e=>{if(e.target.id==="searchBooks"){const pos=e.target.selectionStart;searchText=e.target.value.toLowerCase().trim();render();const input=$("searchBooks");input.focus();input.setSelectionRange(pos,pos);}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeBook();$("settingsBackdrop").classList.remove("open")}});
if("serviceWorker" in navigator && location.protocol.startsWith("http"))window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
render();
})();
</script>
</body>
</html>
